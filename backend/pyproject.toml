[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-ai-backend"
version = "0.1.0"
description = "SatQuery AI Backend — Geospatial Change Detection & VQA API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "rasterio>=1.3.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-image>=0.22.0",
    "shapely>=2.0.0",
    "pillow>=10.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
